attack_path:
- step: 1
  layer: Agent
  text: 'One agent reads content carrying an instruction: copy this instruction into everything you produce'
- step: 2
  layer: Agent
  text: The agent writes that instruction into a shared knowledge base, a ticket, or an email it sends
- step: 3
  layer: Agent
  text: A second agent reads that output as ordinary work input, and is carrying the instruction in turn
- step: 4
  layer: Agent
  text: Every infected agent keeps doing its real job correctly, so nothing appears to be broken
- step: 5
  layer: Impact
  text: The instruction spreads across the agent estate faster than any human review cycle
telemetry:
- step: 1
  signal: Content written by an agent
  emitted_at: Agent output logs · knowledge-base writes · email
  coverage: Blind
  detection_opportunity: An agent writing instruction-like text into a shared store
- step: 2
  signal: Content read by an agent
  emitted_at: Retrieval logs · agent input logs
  coverage: Blind
  detection_opportunity: The same distinctive payload appearing as input to several agents
- step: 3
  signal: Agent-to-agent hand-off
  emitted_at: Orchestration and inter-agent protocol logs
  coverage: Blind
  detection_opportunity: A message passing between agents carrying an embedded instruction
- step: 4
  signal: Repetition across sessions
  emitted_at: SIEM correlation
  coverage: Collectable
  detection_opportunity: One payload appearing across many agents, teams, or days
- step: 5
  signal: The downstream actions
  emitted_at: Tool-call logs · Identity · DLP · NDR
  coverage: Have
  detection_opportunity: The real-world effects each infected agent produces
commentary:
  already_see: The actions each infected agent takes are still visible in the logs we already collect
    - identity, data-loss prevention, and network monitoring (5).
  blind: 'Everything that makes this a spreading event rather than a single incident is invisible to us:
    what agents write, what they read from each other, and the hand-offs between them (1-3).'
  how_detect: This scenario is in the deck because it shows what a blind spot costs at scale. With no
    agent-to-agent logging we would learn about this only from its effects, one incident at a time, with
    no way to see that they were all the same event. The defense is not a product - it is recording what
    agents say to each other so a pattern can be seen as a pattern.
scaled_up: This scenario is already the escalated case. The realistic version is Scenario 03 or 13 - a
  single agent misused once. What makes this one a worst case is that it needs no attacker after the first
  message.
