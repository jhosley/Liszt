schema_version: 1
id: 019
slug: self-spreading-instruction-that-jumps-between-agents
title: Self-spreading instruction that jumps between agents
one_liner: One agent reads a message telling it to repeat that same message in everything it writes. The
  next agent reads that output and does the same. The instruction spreads on its own, and every agent
  keeps doing its normal job while it happens.
status: draft
classification:
  primary_layer_component: Agent
  ai_infrastructure_layer: L3 · Orchestration & Agent
  evidence: doomsday
  priority: NEAR-TERM
  priority_rationale:
  - Every building block for this already exists in our estate today.
  - Nothing like it has been seen outside a research proof of concept.
  - It is here because it shows what our agent blind spot would cost at scale.
