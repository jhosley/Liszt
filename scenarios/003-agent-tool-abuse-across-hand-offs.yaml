schema_version: 1
id: '003'
slug: agent-tool-abuse-across-hand-offs
title: Agent tool-abuse across hand-offs
one_liner: An AI agent that can use tools and act on its own is tricked (or simply over-permitted) into misusing that power - often across hand-offs to other agents that nobody is logging.
status: draft
classification:
  primary_layer_component: Agent
  ai_infrastructure_layer: L3 · Orchestration & Agent
  evidence: seen-in-the-wild
  priority: NOW
  priority_rationale:
  - Agents are being given real production credentials and can take real actions.
  - One injected instruction can turn an agent into an insider acting with our own permissions.
  - The hand-offs between agents are almost entirely unlogged today.
framework_mapping:
  baseline: '2026.07'
  attack:
  - T1059
  - T1213
  - T1567
  atlas:
