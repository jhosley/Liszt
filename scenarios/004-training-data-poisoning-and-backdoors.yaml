    | Layers L1 Data → L2 Model'
attack_path:
- step: 1
  layer: Data
  text: Attacker tampers records in a training / fine-tuning set (or upstream public source / labeling
    pipeline)
- step: 2
  layer: Data → Model
  text: The poisoned data is ingested into a training / fine-tuning run
- step: 3
  layer: Model
  text: The model learns the malicious pattern or a hidden trigger → behavior mapping
- step: 4
  layer: Model
  text: Poison survives evaluation (fires only on the cue, or shifts a distribution subtly)
- step: 5
  layer: Model / inference
  text: In production, the backdoor fires or the bias manifests
telemetry:
- step: 1
  signal: Data write / ingestion into training set
  emitted_at: L1 data-pipeline & storage logs · DLP
  coverage: Collectable
  detection_opportunity: Anomalous source / volume; records outside expected schema or distribution
- step: 2
  signal: Data provenance / lineage
  emitted_at: L1 lineage · data catalog
  coverage: Blind
  detection_opportunity: Data with no / odd lineage; unverified upstream source
- step: 3
  signal: Training-run inputs & config
  emitted_at: ML pipeline / MLOps logs
  coverage: Collectable
  detection_opportunity: Untracked dataset version used in a run; unexpected data mix
- step: 4
  signal: Pre-deployment evaluation results
  emitted_at: Model eval / test harness
  coverage: Collectable
  detection_opportunity: Eval gaps; trigger / backdoor tests; distribution shift
- step: 5
  signal: Anomalous behavior at inference
  emitted_at: L2 behavior monitoring · guardrail
  coverage: Blind
  detection_opportunity: Trigger-input / behavioral anomaly (hard)
commentary:
  already_see: This is caught mostly by data-governance stack - the pipeline and logs that record exactly
    what data went into a training run (steps 1 to 4).
  blind: The near-term work is tracking where data came from (its lineage) and testing models for hidden
    triggers before release; the silent trigger at run-time stays hard (5).
  how_detect: 'Prevention beats detection here: only train on data whose source you''ve verified and expand
    red-teaming for backdoors. Whatever slips through moves to watching the model''s behavior in production.'
scaled_up: A poisoned public dataset or a compromised labeling vendor seeds a hidden trigger into a model
  we reuse across products. It behaves perfectly until the trigger appears, so evaluation never catches
  it.
