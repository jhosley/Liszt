schema_version: 1
id: '004'
slug: training-data-poisoning-and-backdoors
title: Training-data poisoning & backdoors
one_liner: Someone slips bad data into what the model is trained on, planting a hidden flaw or 'backdoor'
  that survives testing and only misbehaves on the attacker's secret cue.
status: draft
classification:
  primary_layer_component: Data → Model
  ai_infrastructure_layer: L1 · Data
  evidence: seen-in-research
  priority: NEAR-TERM
  priority_rationale:
  - Poisoning our training data means reaching that data first, which is harder than the NOW scenarios.
  - If it does succeed, the damage is baked into the model and survives retraining and testing.
  - It is rated NEAR-TERM because it is less likely today, not because it is less serious.
