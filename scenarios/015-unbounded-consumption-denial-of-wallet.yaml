schema_version: 1
id: '015'
slug: unbounded-consumption-denial-of-wallet
title: Unbounded consumption / denial of wallet
one_liner: An attacker (or a runaway AI loop) floods the system with expensive requests, knocking it offline
  for real users and/or running up a massive bill overnight ('denial of wallet').
status: draft
classification:
  primary_layer_component: App / Model
  ai_infrastructure_layer: L4 · Application
  evidence: seen-in-the-wild
  priority: NEAR-TERM
  priority_rationale:
  - This is a real availability and cost risk that we can already partly see today.
  - Agent loops make it far easier to trigger by accident, not only by attack.
  - It is rated NEAR-TERM because existing rate limits and cost monitoring already cover most of it.
