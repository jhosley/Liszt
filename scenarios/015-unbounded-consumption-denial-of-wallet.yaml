attack_path:
- step: 1
  layer: App
  text: Attacker sends expensive / high-volume / amplifying requests (huge inputs, recursion, many-shot)
- step: 2
  layer: Model / infra
  text: Inference consumes disproportionate compute / tokens / cost
- step: 3
  layer: App
  text: Legitimate users are degraded (availability), and/or cost spikes
- step: 4
  layer: Impact
  text: Service DoS and/or a runaway bill ('denial of wallet')
telemetry:
- step: 1
  signal: Request volume / size / rate
  emitted_at: AI gateway · API gateway · rate limits
  coverage: Have
  detection_opportunity: Volume / size spikes; amplification; abusive patterns
- step: 2
  signal: Token / compute / cost per caller
  emitted_at: Usage & cost telemetry
  coverage: Collectable
  detection_opportunity: Cost / token anomaly by user / app / key
- step: 3
  signal: Latency / capacity / errors
  emitted_at: Infra & app monitoring
  coverage: Have
  detection_opportunity: Saturation, queueing, error-rate spikes
- step: 4
  signal: Agent loop / recursion
  emitted_at: L3 orchestration logs
  coverage: Blind
  detection_opportunity: Runaway agent loops; unbounded tool recursion
commentary:
  already_see: API rate limits and infrastructure / cost monitoring already see request floods, slowdowns,
    and spend (steps 1 to 3) - standard availability and cost telemetry.
  blind: The near-term add is per-user token / cost accounting (2) and spotting an agent stuck in an expensive
    loop (4).
  how_detect: Rate-limit, set quotas, and give each identity a cost budget with alerts; watch for runaway
    agent loops. Mostly your existing availability and cost controls, pointed at inference.
scaled_up: A runaway agent loop or a deliberate flood consumes so much inference capacity that real users
  are locked out, and the bill arrives before anyone notices the pattern.
