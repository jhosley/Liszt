notes: >-
  MAPPING RECONCILIATION. The first draft of this record carried framework IDs written from
  memory, including T1606 and T1552.001. When the mapper re-derived them against the pinned
  ATT&CK 19.1 bundle and ATLAS 2026.07 YAML, several changed: T1606 became T1550.001, T1552.001
  became T1552, and six ATLAS IDs were added where the draft had two. Nothing was wrong in
  spirit; the IDs were simply not checked. This is the single most common defect in a first
  draft and it is why the verification gate exists.
  A reviewer pushed back on two things and both changes stuck. First, the original step 4 read
  "malicious dataset configs on the target platform: a local-file read leaks pod secrets, then
  template injection gives RCE", two distinct mechanisms crammed into one step. It stayed as one
  step because the slide caps at six, but mapping_notes now records that the step covers two
  vectors. Second, the original priority_rationale was three lines about the incident with nothing
  about us; the third line was rewritten to name our own exposure.
  Open question for the next revision: whether step 3, rooting third-party infrastructure, belongs
  in our scenario at all, since we would never see it. It stays because it explains how the agent
  reached us, and removing it makes step 4 arrive from nowhere.
