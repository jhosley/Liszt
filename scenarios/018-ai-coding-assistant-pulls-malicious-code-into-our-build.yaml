attack_path:
- step: 1
  layer: External
  text: Attacker registers a package name that AI coding assistants are known to invent
- step: 2
  layer: Data
  text: Or plants hidden instructions in a repository file the assistant reads as guidance
- step: 3
  layer: Application
  text: A developer asks the assistant for help and accepts its suggestion
- step: 4
  layer: Host / CI
  text: The suggested dependency is installed and runs on the developer machine and in the build
- step: 5
  layer: Impact
  text: Attacker code reaches our software supply chain carrying a developer's own credentials
telemetry:
- step: 1
  signal: Dependency added to a project
  emitted_at: Source control · package manager · build logs
  coverage: Have
  detection_opportunity: A dependency no human explicitly chose; a package with no history
- step: 2
  signal: Package reputation and age
  emitted_at: Software composition analysis · package registry
  coverage: Have
  detection_opportunity: Package created very recently, or a near-miss of a well-known name
- step: 3
  signal: Assistant suggestion accepted
  emitted_at: Coding-assistant telemetry
  coverage: Blind
  detection_opportunity: Which code and dependencies came from the assistant rather than a person
- step: 4
  signal: Repository instruction files
  emitted_at: Source-control diffs
  coverage: Collectable
  detection_opportunity: Changes to the configuration and rules files the assistant reads as instructions
- step: 5
  signal: Build and developer host behavior
  emitted_at: EDR · CI runner logs · NDR
  coverage: Have
  detection_opportunity: Install scripts reaching the network; unexpected execution during build
commentary:
  already_see: 'Our existing software supply-chain controls cover most of this: composition analysis flags
    brand-new or lookalike packages (1, 2), and endpoint and build monitoring catch an install script
    behaving badly (5).'
  blind: The AI-specific gap is that we cannot tell which code and which dependencies came from the assistant
    rather than from a person (3), so we cannot give AI-suggested changes the extra scrutiny they warrant.
  how_detect: Treat AI-suggested code as untrusted third-party input rather than as the developer's own
    work. The one new signal worth having is origin - mark what the assistant wrote, then apply the dependency
    and review controls we already run.
scaled_up: A package name that assistants suggest across many teams is registered by an attacker. It is
  installed dozens of times before anyone notices, and it runs with each developer's own credentials.
