schema_version: 1
id: 018
slug: ai-coding-assistant-pulls-malicious-code-into-our-build
title: AI coding assistant pulls malicious code into our build
one_liner: An attacker registers a package name that AI coding assistants tend to invent or hides instructions
  in a repository file the assistant reads. The developer trusts the suggestion, and attacker code walks
  straight into our build.
status: draft
classification:
  primary_layer_component: Application
  ai_infrastructure_layer: L4 · Application
  evidence: seen-in-the-wild
  priority: NEAR-TERM
  priority_rationale:
  - Attackers are already registering the package names AI assistants invent.
  - Our developers use these assistants daily, and their suggestions are trusted by default.
  - It is rated NEAR-TERM because our existing supply-chain controls catch most of it once it lands.
