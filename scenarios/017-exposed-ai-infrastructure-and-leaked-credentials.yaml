attack_path:
  - step: 1
    layer: External
    text: Attacker scans the internet for AI services that were stood up quickly and left open
    attack:
      - T1595
  - step: 2
    layer: Model / Data
    text: Finds an inference endpoint, vector store, or notebook with no login in front of it
    attack:
      - T1190
    atlas:
      - AML.T0049
  - step: 3
    layer: Identity
    text: Or recovers a working AI provider key from a public repository, container image, or log file
    attack:
      - T1552.001
    atlas:
      - AML.T0055
  - step: 4
    layer: Model / Data
    text: Uses that access to read data, run inference at our expense, or pull the model itself
    attack:
      - T1078
    atlas:
      - AML.T0024
  - step: 5
    layer: Impact
    text: Data exposure, unbudgeted spend, and an unmonitored foothold inside the AI estate
    attack:
      - T1530
