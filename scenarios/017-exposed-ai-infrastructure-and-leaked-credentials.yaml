commentary:
  already_see: 'This is exposure management, our existing tools already do it: external attack-surface scanning finds the
    open endpoint (1), secret scanning finds the leaked key (3), and identity and network logs show the unexpected access
    (4).'
  blind: The near-term add is knowing which AI endpoints exist in the first place and being able to see inference usage 
    that belongs to no known owner (2, 5).
  how_detect: There is no new detector to buy here. The gap is inventory - we cannot protect AI infrastructure we do not
    know exists. This is the clearest argument in the whole deck for an authoritative record of every AI endpoint, who 
    owns it, and what it can reach.
scaled_up: An AI endpoint stood up for a pilot is left open for months. An attacker uses it to read the data behind it 
  and to run inference on our account, and none of it appears in any system that we watch.
