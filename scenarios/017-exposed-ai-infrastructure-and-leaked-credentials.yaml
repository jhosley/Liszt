schema_version: 1
id: '017'
slug: exposed-ai-infrastructure-and-leaked-credentials
title: Exposed AI infrastructure & leaked credentials
one_liner: An AI service gets stood up quickly for a project and left reachable with no login, or its access key ends up
  in a public code repository. An attacker finds it before we do.
status: published
classification:
  primary_layer_component: Model / Data
  ai_infrastructure_layer: L2 · Model
  evidence: seen-in-the-wild
  priority: NOW
  priority_rationale:
    - Internet scans keep finding unauthenticated AI services, and ours are built the same way.
    - An open endpoint or a leaked key needs no exploit at all - the attacker simply uses it.
    - We do not have a reliable list of our own AI endpoints, so we cannot confirm we have none exposed.
