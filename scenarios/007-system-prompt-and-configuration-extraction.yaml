attack_path:
- step: 1
  layer: App
  text: Attacker prompts the model to reveal its system prompt / instructions / tool config
- step: 2
  layer: Model
  text: Model discloses the system prompt, guardrail rules, or embedded credentials / keys
- step: 3
  layer: App
  text: Attacker gains the blueprint, rules, tools, secrets
- step: 4
  layer: Various
  text: Uses it to craft targeted jailbreaks / injections, or abuses leaked secrets
telemetry:
- step: 1
  signal: Prompt content (extraction attempts)
  emitted_at: AI gateway prompt logs
  coverage: Collectable
  detection_opportunity: System-prompt-extraction patterns ('repeat your instructions')
- step: 2
  signal: Model output (contains system prompt / secrets)
  emitted_at: AI gateway output · guardrail scan
  coverage: Blind
  detection_opportunity: Output contains known system-prompt text or secret patterns
- step: 3
  signal: Secret exposure
  emitted_at: Secrets scanning · DLP
  coverage: Collectable
  detection_opportunity: Known credential / key pattern in a response
- step: 4
  signal: Follow-on attack activity
  emitted_at: Jailbreak / injection telemetry (Scenarios 01, 08)
  coverage: Blind
  detection_opportunity: Spike in jailbreak / injection attempts after a leak
commentary:
  already_see: Scan the model's answers for your own hidden instructions or secret keys - if your confidential
    system prompt shows up in a reply, you'll know (steps 2 to 3).
  blind: The near-term work is output scanning; the harder part is linking a leak to the follow-on attacks
    it enables (4).
  how_detect: Plant a known phrase in your system prompt and alert if it ever appears in output; scan
    replies for secrets. The best fix, though, is preventive - never put secrets in the prompt.
scaled_up: An attacker recovers the full hidden instruction set, the list of tools the AI can call, and
  any secrets embedded in them - then uses that map to build reliable attacks against every user of the
  application.
