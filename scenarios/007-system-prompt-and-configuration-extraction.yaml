title: System-prompt & configuration extraction
one_liner: An attacker gets the AI to reveal its own hidden instructions, rules, and any secrets baked
  into them - then uses that blueprint to attack it reliably.
status: draft
classification:
  primary_layer_component: Model / App
  ai_infrastructure_layer: L2 · Model
  evidence: seen-in-the-wild
  priority: NEAR-TERM
  priority_rationale:
  - Extracting an AI's hidden instructions is easy and is attempted constantly.
  - On its own the direct damage is limited, which is why it is not rated NOW.
  - It matters because it hands an attacker the map they need for the attacks that are rated NOW.
