schema_version: 1
id: '002'
slug: model-supply-chain-compromise
title: Model supply-chain compromise
one_liner: A downloaded AI model isn't just data - loading it can run hidden code, or the model itself
  can be secretly backdoored. Importing a model is like installing software from a stranger.
status: draft
classification:
  primary_layer_component: Model
  ai_infrastructure_layer: L2 · Model
  evidence: seen-in-the-wild
  priority: NOW
  priority_rationale:
  - Malicious model files have been found on public model hubs and downloaded by real teams.
  - Loading a tampered model file can run the attacker's code on our infrastructure immediately.
  - We can see the code running, but we cannot currently prove where a model file came from.
