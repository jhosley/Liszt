slug: jailbreak-guardrail-bypass
title: Jailbreak / guardrail bypass
one_liner: An attacker crafts a message that talks the AI past its safety rules ('jailbreak'), getting
  it to produce banned content or unlock actions it was told not to take.
status: draft
classification:
  primary_layer_component: Model / App
  ai_infrastructure_layer: L2 · Model
  evidence: seen-in-the-wild
  priority: NOW
  priority_rationale:
  - Guardrail bypasses are attempted constantly and succeed regularly.
  - 'The consequences are immediate: harmful output, brand damage, and safety failures.'
  - We do not currently record when a guardrail fires or when it is defeated.
