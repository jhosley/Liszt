  kind: control
commentary:
  already_see: Safety filters that scan both the prompt and the answer are the front-line control; the
    AI-specific gap is simply recording the filter's own decisions as data (step 2).
  blind: 'Near-term: log every safety-filter decision and refusal rate (2, 5) and classify risky output
    (3). Subtle bypasses that look like a normal ''allowed'' answer stay hard.'
  how_detect: 'Treat the safety filter as a sensor, not just a gate: log every allow / block, watch for
    spikes in bypass attempts, and connect a jailbreak-style prompt to a banned answer or an unlocked
    action.'
scaled_up: An automated tool defeats our guardrails at scale to mass-produce disallowed content or unlocks
  a dangerous capability on an agent we assumed was safely fenced off.
