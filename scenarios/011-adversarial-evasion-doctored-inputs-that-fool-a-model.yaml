attack_path:
- step: 1
  layer: App
  text: Attacker makes small, deliberate changes to an input so the model gets it wrong
- step: 2
  layer: Model
  text: The model misclassifies, or is steered to the attacker's target output
- step: 3
  layer: App
  text: The ML-based control (fraud / malware / moderation) is bypassed
- step: 4
  layer: Impact
  text: Malicious content or transaction passes as benign
telemetry:
- step: 1
  signal: Input content (signs of deliberate tampering)
  emitted_at: AI gateway · model input logs
  coverage: Collectable
  detection_opportunity: Inputs that look deliberately doctored to fool the model
- step: 2
  signal: Model confidence / output anomaly
  emitted_at: Model monitoring · scores
  coverage: Collectable
  detection_opportunity: Low-confidence or near-boundary decisions; confidence anomalies
- step: 3
  signal: Control-bypass outcome
  emitted_at: The protected system's logs (fraud / AV / moderation)
  coverage: Have
  detection_opportunity: Downstream fraud / malware / abuse the ML missed
- step: 4
  signal: Model performance drift
  emitted_at: Eval / monitoring metrics
  coverage: Collectable
  detection_opportunity: Accuracy / precision drop on a slice
commentary:
  already_see: When an AI-based control (fraud, malware, moderation) is fooled, the system it protects
    still catches the bad outcome - that's your safety net (step 3).
  blind: 'Near-term: watch the model''s own confidence and accuracy for tell-tale dips (2, 4). Recognizing
    a doctored input as an attack in real time is genuinely hard.'
  how_detect: 'Never trust one AI control alone: monitor its confidence and performance, keep a non-AI
    backstop, and adversarially test it. Detection here is mostly ''watch the model''s own health metrics.'''
scaled_up: An attacker works out how to reliably fool an AI-based fraud or malware check, making that
  control blind to an entire category of abuse while it continues to report itself as healthy.
