schema_version: 1
id: '011'
slug: adversarial-evasion-doctored-inputs-that-fool-a-model
title: Adversarial evasion - doctored inputs that fool a model
one_liner: An attacker tweaks an input just enough to fool an AI-based security control (fraud, malware,
  or content filtering) into waving something malicious through as harmless.
status: draft
classification:
  primary_layer_component: Model
  ai_infrastructure_layer: L2 · Model
  evidence: seen-in-research
  priority: BACKLOG
  priority_rationale:
  - This only matters where an AI model is itself acting as a security control.
  - In our estate that is a small number of systems, such as fraud and malware scoring.
  - Where a non-AI backstop exists, the bad outcome is still caught by that backstop.
