schema_version: 1
id: '020'
slug: upstream-compromise-of-a-shared-foundation-model
title: Upstream compromise of a shared foundation model
one_liner: The foundation model sitting underneath many of our applications is compromised before it ever
  reaches us. It behaves perfectly until a specific trigger appears, so nothing we test would find it.
status: draft
classification:
  primary_layer_component: Model
  ai_infrastructure_layer: L2 · Model
  evidence: doomsday
  priority: BACKLOG
  priority_rationale:
  - It depends on an upstream compromise we can neither influence nor prevent.
  - Nothing like it has been observed anywhere.
  - It is here because it is the sharpest test of whether we know our own estate.
framework_mapping:
  baseline: '2026.07'
  attack: []
