    | Layers L2 Model, estate-wide'
attack_path:
- step: 1
  layer: External
  text: A foundation-model provider, or a widely used open model, is compromised at the source
- step: 2
  layer: External
  text: The compromise is behavioral, not a changed file, the model responds normally except to one trigger
- step: 3
  layer: Model
  text: We adopt the model through our normal process; it passes every evaluation, because nobody tests
    the trigger
- step: 4
  layer: Model / Agent
  text: The model is deployed behind many applications and agents at the same time
- step: 5
  layer: Impact
  text: Every AI system in the estate shares one hidden failure mode, fired at a time of the attacker's
    choosing
telemetry:
- step: 1
  signal: Model origin and version in use
  emitted_at: Model registry · AI gateway · AI inventory
  coverage: Collectable
  detection_opportunity: Which exact model version is running behind each application
- step: 2
  signal: Evaluation results over time
  emitted_at: Model evaluation pipeline
  coverage: Collectable
  detection_opportunity: A shift in behavior between versions that testing did not explain
- step: 3
  signal: Model behavior in production
  emitted_at: Output logs · guardrail decisions
  coverage: Blind
  detection_opportunity: An unexplained change in how a model answers a class of input
- step: 4
  signal: Simultaneous anomalies
  emitted_at: SIEM correlation
  coverage: Blind
  detection_opportunity: Several unrelated AI applications behaving oddly at the same moment
- step: 5
  signal: The resulting actions
  emitted_at: Tool-call · Identity · DLP · NDR
  coverage: Have
  detection_opportunity: Whatever the triggered behavior causes downstream
commentary:
  already_see: The consequences would still show up in the logs we already run - whatever the model is
    made to do leaves the usual traces (5).
  blind: 'We could not currently answer the first question anyone would ask: which exact model version
    sits behind which application and did several of them change behavior at the same time (1, 3, 4).'
  how_detect: This is a concentration-risk scenario and the strongest argument for knowing our own estate.
    We cannot prevent an upstream compromise. What we can do is answer, in minutes rather than weeks,
    exactly where a given model is running and what it can reach.
scaled_up: This scenario is already the escalated case. The realistic version is Scenario 02 - one bad
  model file in one place. What makes this one a worst case is that every application would be affected
  at the same moment.
