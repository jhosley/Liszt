# Infrastructure shape. Reference data: the layers, seams and emitted categories of one kind
# of estate. schema/infrastructure-shape.schema.json defines it. The viewer's environment
# pages read this file; edit it here, never on the page.

shape_version: 1
id: SHAPE-WEB-04
family: web-application
name: Public cloud web app behind a web application firewall
status: proposed
lede: A web application estate shape from the parked beyond-AI proposal.
where: Public cloud
owners:
- Network security
- Platform engineering
- Cloud team
layers:
- code: W0
  name: Edge
- code: W1
  name: Filtering tier
- code: W2
  name: Application
- code: W3
  name: Data
- code: W4
  name: Control plane
seams:
- tag: Edge / net
  layer: W0
- tag: WAF / rule
  layer: W1
- tag: Host / Cloud
  layer: W1
- tag: App / session
  layer: W2
- tag: App -> Data
  layer: W2
- tag: Data / store
  layer: W3
- tag: Control plane
  layer: W4
emits:
- category: Web application firewall rule hits
- category: Filtering tier host and access logs
- category: Application logs
- category: Cloud control plane audit trail
- category: Storage access logs, if enabled
gap: The filtering tier is a request relaying device by design, and anything it is trusted to reach it
  can be made to reach on somebody else's behalf.
note: Added because a real incident arrived that did not fit any of the other shapes. Proposed, not in
  the catalog. No scenario is classified against it. Carrying it as a record means the model already holds
  the answer to whether coverage is one number or one per stack.
provenance:
  authored_by: Program lead
  created: '2026-09-14'
  last_updated: '2026-09-14'
