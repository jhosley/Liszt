<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000"><rect width="1680" height="1000" fill="#FFFFFF"/><defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C6E8F"/>
  </marker>
  <marker id="headg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B78"/>
  </marker>
</defs><text x="60" y="58" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#2C6E8F" font-weight="bold" text-anchor="start" letter-spacing="4">LISZT</text><text x="60" y="92" font-family="Cambria, Georgia, serif" font-size="27" fill="#1F2D38" font-weight="bold" text-anchor="start">What it is, how you use it, and where the output goes</text><line x1="60" y1="112" x2="1620" y2="112" stroke="#D4D9DE" stroke-width="2"/><text x="60" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><circle cx="70" cy="147" r="11" fill="#2C6E8F"/><text x="70" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="92" y="153" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start" letter-spacing="1.6">YOU PUT IN</text><text x="470" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><circle cx="480" cy="147" r="11" fill="#2C6E8F"/><text x="480" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="502" y="153" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start" letter-spacing="1.6">LISZT HOLDS</text><text x="900" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><circle cx="910" cy="147" r="11" fill="#2C6E8F"/><text x="910" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><text x="932" y="153" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start" letter-spacing="1.6">LISZT PRODUCES</text><text x="1300" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><circle cx="1310" cy="147" r="11" fill="#2C6E8F"/><text x="1310" y="152" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text><text x="1332" y="153" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start" letter-spacing="1.6">IT GOES HERE</text><rect x="60" y="190" width="340" height="99" rx="6" fill="#E7EEF3" stroke="#2C6E8F" stroke-width="1.5"/><text x="78" y="216" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2D38" font-weight="bold" text-anchor="start">An analyst</text><text x="78" y="237" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">Writes the scenario record:</text><text x="78" y="256" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">the attack path, the signals,</text><text x="78" y="275" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">the framework mapping.</text><line x1="408" y1="239.5" x2="462" y2="239.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="60" y="311" width="340" height="99" rx="6" fill="#E7EEF3" stroke="#2C6E8F" stroke-width="1.5"/><text x="78" y="337" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2D38" font-weight="bold" text-anchor="start">A working group session</text><text x="78" y="358" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">Adds the coverage scores,</text><text x="78" y="377" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">a named owner for every gap,</text><text x="78" y="396" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">and a ticket number.</text><line x1="408" y1="360.5" x2="462" y2="360.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="60" y="432" width="340" height="80" rx="6" fill="#EFF2F5" stroke="#5B6B78" stroke-width="1.5"/><text x="78" y="458" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2D38" font-weight="bold" text-anchor="start">Real incidents and research</text><text x="78" y="479" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">One file per incident, cited</text><text x="78" y="498" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">by the scenarios it grounds.</text><line x1="408" y1="472.0" x2="462" y2="472.0" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="60" y="534" width="340" height="99" rx="6" fill="#EFF2F5" stroke="#5B6B78" stroke-width="1.5"/><text x="78" y="560" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2D38" font-weight="bold" text-anchor="start">Frozen framework files</text><text x="78" y="581" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">MITRE ATT&amp;CK, MITRE ATLAS,</text><text x="78" y="600" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">OWASP, DeTT&amp;CT. Downloaded</text><text x="78" y="619" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B78" font-weight="normal" text-anchor="start">once and checksummed.</text><line x1="408" y1="583.5" x2="462" y2="583.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="470" y="190" width="360" height="470" rx="6" fill="#FFFFFF" stroke="#1F2D38" stroke-width="2.5"/><rect x="470" y="190" width="360" height="46" rx="6" fill="#1F2D38"/><rect x="470" y="222" width="360" height="14" fill="#1F2D38"/><text x="490" y="220" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" letter-spacing="1.5">THE LIBRARY</text><text x="690" y="220" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9FB3C0" font-weight="normal" text-anchor="start">one git repository</text><rect x="492" y="256" width="316" height="74" rx="5" fill="#EFF2F5" stroke="#D4D9DE" stroke-width="1"/><text x="510" y="280" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start">scenarios/</text><text x="510" y="300" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">One YAML file per scenario.</text><text x="510" y="317" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">This is the record. Edit this.</text><rect x="492" y="340" width="316" height="74" rx="5" fill="#EFF2F5" stroke="#D4D9DE" stroke-width="1"/><text x="510" y="364" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start">incidents/</text><text x="510" y="384" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">One file per real incident,</text><text x="510" y="401" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">cited by the scenarios.</text><rect x="492" y="424" width="316" height="74" rx="5" fill="#EFF2F5" stroke="#D4D9DE" stroke-width="1"/><text x="510" y="448" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start">coverage/&lt;org&gt;/</text><text x="510" y="468" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Each organization's own view.</text><text x="510" y="485" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Optional, and stays theirs.</text><rect x="492" y="508" width="316" height="74" rx="5" fill="#EFF2F5" stroke="#D4D9DE" stroke-width="1"/><text x="510" y="532" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2C6E8F" font-weight="bold" text-anchor="start">frameworks/</text><text x="510" y="552" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">The frozen framework files</text><text x="510" y="569" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">plus their checksums.</text><line x1="650" y1="660" x2="650" y2="686" stroke="#B0463B" stroke-width="2"/><rect x="470" y="686" width="360" height="118" rx="6" fill="#FBEEEC" stroke="#B0463B" stroke-width="2"/><text x="492" y="716" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#B0463B" font-weight="bold" text-anchor="start" letter-spacing="1.4">THE GATE</text><text x="492" y="740" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2D38" font-weight="normal" text-anchor="start">schema/ says what a record may contain.</text><text x="492" y="757" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2D38" font-weight="normal" text-anchor="start">tools/validate.py checks every record against it</text><text x="492" y="774" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2D38" font-weight="normal" text-anchor="start">and against the quality bar. Nothing is published</text><text x="492" y="791" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2D38" font-weight="normal" text-anchor="start">until it passes with zero errors and zero warnings.</text><line x1="838" y1="250.5" x2="892" y2="250.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="900" y="200" width="350" height="101" rx="6" fill="#EAF2ED" stroke="#2F7D57" stroke-width="1.5"/><text x="920" y="227" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1F2D38" font-weight="bold" text-anchor="start">tools/render_slides.py</text><text x="920" y="248" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Rebuilds the PowerPoint deck</text><text x="920" y="267" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">from the records, using your</text><text x="920" y="286" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">template for the styling.</text><line x1="1258" y1="250.5" x2="1294" y2="250.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><line x1="838" y1="385.5" x2="892" y2="385.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="900" y="335" width="350" height="101" rx="6" fill="#E7EEF3" stroke="#2C6E8F" stroke-width="1.5"/><text x="920" y="362" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1F2D38" font-weight="bold" text-anchor="start">tools/coverage.py</text><text x="920" y="383" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Computes coverage, exposure</text><text x="920" y="402" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">and maturity. Never guesses:</text><text x="920" y="421" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">unscored is absent, not zero.</text><line x1="1258" y1="385.5" x2="1294" y2="385.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><line x1="838" y1="520.5" x2="892" y2="520.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="900" y="470" width="350" height="101" rx="6" fill="#FAF3E2" stroke="#B5852B" stroke-width="1.5"/><text x="920" y="497" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1F2D38" font-weight="bold" text-anchor="start">tools/publish_library.py</text><text x="920" y="518" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Writes one readable page per</text><text x="920" y="537" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">scenario for search and</text><text x="920" y="556" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">wide-audience browsing.</text><line x1="1258" y1="520.5" x2="1294" y2="520.5" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><rect x="1300" y="200" width="320" height="82" rx="6" fill="#FFFFFF" stroke="#2F7D57" stroke-width="2"/><text x="1320" y="227" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2F7D57" font-weight="bold" text-anchor="start">The deck</text><text x="1320" y="248" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Working group, leadership,</text><text x="1320" y="267" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">tabletop material.</text><rect x="1300" y="316" width="320" height="101" rx="6" fill="#FFFFFF" stroke="#2C6E8F" stroke-width="2"/><text x="1320" y="343" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2C6E8F" font-weight="bold" text-anchor="start">The numbers</text><text x="1320" y="364" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Risk reporting, the</text><text x="1320" y="383" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">instrumentation backlog,</text><text x="1320" y="402" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">year over year trend.</text><rect x="1300" y="451" width="320" height="82" rx="6" fill="#FFFFFF" stroke="#B5852B" stroke-width="2"/><text x="1320" y="478" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B5852B" font-weight="bold" text-anchor="start">Search pages</text><text x="1320" y="499" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">SharePoint, Copilot, anyone</text><text x="1320" y="518" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">who asks whether we cover X.</text><rect x="1300" y="572" width="320" height="100" rx="6" fill="#FFFFFF" stroke="#B0463B" stroke-width="2"/><text x="1320" y="601" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B0463B" font-weight="bold" text-anchor="start">Tickets</text><text x="1320" y="623" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">Every gap leaves the session</text><text x="1320" y="642" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">with an owner and a ticket.</text><text x="1320" y="661" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B78" font-weight="normal" text-anchor="start">This is the point of the work.</text><line x1="842" y1="712" x2="1294" y2="646" stroke="#5B6B78" stroke-width="2.2" marker-end="url(#head)"/><text x="866" y="748" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B78" font-weight="normal" text-anchor="start">owners and ticket numbers are typed</text><text x="866" y="766" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B78" font-weight="normal" text-anchor="start">straight into the record</text><rect x="60" y="840" width="1560" height="108" rx="8" fill="#EFF2F5" stroke="#D4D9DE" stroke-width="1.5"/><text x="84" y="872" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2D38" font-weight="bold" text-anchor="start" letter-spacing="1.5">THE ONE RULE</text><text x="84" y="902" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1F2D38" font-weight="normal" text-anchor="start">The record is the truth. The deck, the numbers and the search pages are printed from it and can be deleted and rebuilt at any time.</text><text x="84" y="928" font-family="Calibri, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B0463B" font-weight="normal" text-anchor="start">Editing a slide does not change anything. The next rebuild overwrites it.</text></svg>