# ═══════════════════════════════════════════════════════════════════════════════
# WORKED EXAMPLE, scratch pipeline. THE SAME OBSERVATIONS AS RUN-01.
#
# Read this one second, and read it as a lesson about environments rather than about
# scenario 021. Every observation below is byte for byte identical to RUN-01. The only
# thing that changed is telemetry_pipeline: the lab collected with its own tooling
# instead of shipping to the real collectors and the real detection content.
#
# That one field changes what the run is allowed to settle. Score both and compare:
# the Have and Collectable rows go unscoreable at the coverage level, because their
# truth depends on OUR detection, which a scratch lab does not contain. The Blind row
# is still fully scored, and it still finds the surprise.
#
# The lesson to take to the lab build: a cheap lab is a Blind hunting instrument. That
# is genuinely worth having, and it is not a detection test.
# ═══════════════════════════════════════════════════════════════════════════════

run_version: 1
run_id: RUN-021-2026-08-05-02
spec_id: ST-021
scenario: '021'

# Binds this run to the exact prediction it is scored against. The scorer recomputes
# this and refuses if it has moved, which is what makes a prediction quietly edited
# after the fact detectable rather than merely discouraged.
prediction_digest: 8428c2c4ba6fd98f539b03b9e6e31a7d3f007965b25290ec35fee6def48f64ed
spec_digest: 291ef8626e7130485f234bada1c0d7affcbf4c0ebbe923638cf6b3fa4c5de931

executed: '2026-08-05'
executed_by: Detection Engineering, with AI Platform observing

agent:
  adapter: abstract action set bound by hand for this first run; no runner library yet
  build: manual
  model: none, a human executed the procedure

environment:
  # The versioned lab this run executed in; see environments/. kind and pipeline below
  # must agree with it, and the validator checks that they do.
  definition: {id: ENV-LAB-021-SCRATCH, version: 1}
  kind: lab-ephemeral
  telemetry_pipeline: scratch
  targets_used:
    - lab-eks-liszt-021
    - lab-dataproc-021
  teardown_confirmed: true
  deviations:
    - >-
      The spec asked for a mirrored pipeline and the environment delivered scratch. The
      scorer reads THIS field, not the spec's, which is why the run degrades honestly
      instead of scoring claims it cannot see.
    - The lab cluster runs one node group; production runs three with different instance profiles, 
      so a metadata credential path that exists in production may be absent here.
    - Artifactory in the lab is a standalone instance, not the production cluster behind the CDN, so
      proxy access log formats match but volume and caching do not.

autonomy_used: lab-only
stop_conditions_triggered: []

# ── observations ──────────────────────────────────────────────────────────────
# Recorded from what was seen, before reading the prediction. 'unscoreable' is a
# legitimate answer and is always better than a guess.

observations:
  - step: 1
    executed: true
    observed: logged-only
    observed_source: >-
      Agent platform run manifest, emitted to the eval harness job log
      (lab index=agent_evals, field run.safety_profile)
    detection_fired: false
    latency_seconds: 4
    artifacts:
      - "query: index=agent_evals run.safety_profile=* | table run_id, safety_profile"
      - "screenshot: evidence/RUN-021-01/step1-manifest.png"
    surprises:
      - >-
        The record says nothing emits this today. The eval harness has in fact written a
        run manifest, including the safeguard profile, since the platform upgrade in May.
        Nobody on the scenario knew, because the field was added after the row was scored.
    notes: >-
      The artifact is a job log line rather than a first class event, and retention on
      that index is seven days, so this is real but thin coverage.

  - step: 2
    executed: true
    observed: detected
    observed_source: Palo Alto NGFW traffic logs, index=net_egress
    detection_fired: true
    detection_artifact_observed: NET-EGRESS-ANOM-07
    latency_seconds: 96
    artifacts:
      - "saved search NET-EGRESS-ANOM-07, returned 1 row for the run window"
    surprises: []
    notes: The claim on this row held exactly as written.

  - step: 3
    executed: true
    observed: logged-only
    # Name ONLY where the artifact was found. Where it was NOT found belongs in notes:
    # this field is compared against the predicted source, and prose about the negative
    # case makes a miss read as a match.
    observed_source: containerd runtime events, index=k8s_runtime
    detection_fired: false
    latency_seconds: 22
    artifacts:
      - "query: index=app_dataproc source=worker.jsonl -> 0 results"
      - "query: index=k8s_runtime -> config parse and file read visible"
    surprises:
      - >-
        The config parsing happens in an init container, which does not write to the
        application log at all. The artifact exists, but not where the row says.
    notes: >-
      The dataset-worker application log (index=app_dataproc, source=worker.jsonl), which
      is the source this row names, contained nothing for this action. Right that we would
      have something, wrong about which system. An investigator following this row would
      have searched an empty index and concluded Blind.

  - step: 4
    executed: true
    observed: logged-only
    observed_source: CrowdStrike Falcon ProcessRollup2, index=edr_main
    detection_fired: false
    detection_artifact_observed: 'EDR-CONT-0113 did not fire'
    latency_seconds: 41
    artifacts:
      - "process ancestry captured: containerd-shim -> python -> sh"
      - "rule EDR-CONT-0113 evaluated against the events, no match"
    surprises: []
    notes: >-
      The process events landed exactly where the row says. The detection did not fire:
      the rule keys on a parent process name the lab pod spec does not produce. The
      visibility half of this row is right and the detection half is not.

  - step: 5
    executed: true
    observed: absent
    observed_source: ''
    detection_fired: false
    latency_seconds:
    artifacts:
      - "query: EKS control-plane audit, CloudWatch /aws/eks/lab/cluster -> no entries for the metadata
        read"
      - "query: CloudTrail -> no entries; the read never reaches the control plane"
    surprises: []
    notes: >-
      The record scores this Collectable on the assumption that the K8s audit log
      captures a pod reading the instance metadata service. It does not: that read never
      touches the API server, so there is nothing for the audit log to record. The
      privileged pod creation IS captured; the metadata read is not, and the row conflates
      the two.

  - step: 6
    executed: false
    not_executed_reason: >-
      The procedure requires reaching public web services for the C2 and exfiltration
      channel, and authorization.egress is deny-all. Executing it would have required
      widening the allowlist beyond the lab boundary, which is a stop condition. Needs a
      lab-internal stand-in for the paste and file-drop services before this step can run.
    observed: unscoreable
    surprises: []
    notes: Deferred to the next run, once the lab has an internal C2 stand-in.
