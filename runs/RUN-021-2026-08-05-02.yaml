feedback:
  proposed_rescores:
    - step: 1
      from: Blind
      to: Collectable
      field: visibility
      reason: the record says nothing is emitted, and the run found an artifact in Agent platform 
        run manifest, emitted to the eval harness job log (lab index=agent_evals, field 
        run.safety_profile). Free coverage the library did not know it had.
  method_findings:
    - Only 1 row(s) were scoreable, so the rates above are a data point and not a trend. Report the 
      counts, not the percentages, until the denominator is worth a percentage.
    - At least one artifact appeared somewhere other than the system named on the row. The 
      visibility judgment was right and the source field was wrong, which sends an investigator to 
      the wrong log on the day it matters. Worth a look at whether sources are being captured with 
      the system owner in the room.
    - '2 unpredicted signal(s) recorded. These are the cheapest coverage in the program: sources that
      already work and are on no record.'
  lab_findings:
    - Pipeline mode 'scratch' capped what this run could prove. To test detection claims the lab has
      to ship to the same collectors and detection content as the estate being scored.
    - Environment deviations were recorded; each one is a candidate requirement for the next lab 
      build.
  new_sources_found:
    - 'step 1: Agent platform run manifest, emitted to the eval harness job log (lab index=agent_evals,
      field run.safety_profile)'
